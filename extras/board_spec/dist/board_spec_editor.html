      for (const key of node.required ?? []) if (!Object.prototype.hasOwnProperty.call(item, key)) {
        issue("E_SCHEMA_REQUIRED", `${at}/${key}`, "required property is missing");
      }
      const properties = node.properties ?? {};
      for (const [key, child] of Object.entries(item)) {
        if (node.propertyNames) visit(key, node.propertyNames, `${at}/${key}`);
        if (Object.prototype.hasOwnProperty.call(properties, key)) visit(child, properties[key], `${at}/${key}`);
        else if (plainObject(node.additionalProperties)) visit(child, node.additionalProperties, `${at}/${key}`);
        else if (node.additionalProperties === false) issue("E_UNKNOWN_KEY", `${at}/${key}`, "key is not declared by the schema");
      }
    }
  };
  visit(value, schema, path);
  return issues;
}


// lib/ctypes.js

const issue = (id, path, message) => ({ id, path, message });
const ctypeOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);

function uniqueCtypeErrors(errors) {
  const seen = new Set();
  return errors.filter((item) => {
    const key = `${item.id}\0${item.path}\0${item.message}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function validateConnectorTypes(types) {
  const errors = [];
  const idPattern = /^[a-z][a-z0-9_]*$/;
  for (const [catalogId, type] of Object.entries(types ?? {})) {
    const path = `/${catalogId}`;
    if (!isPlainObject(type) || !idPattern.test(type.id ?? "") || type.id !== catalogId) {
      errors.push(issue("E_CTYPE_FORMAT", `${path}/id`, "connector type ID must be snake_case and match its catalog key"));
      continue;
    }
    if (!isPlainObject(type.layout) || !Number.isInteger(type.layout.rows) || !Number.isInteger(type.layout.cols)) {
      errors.push(issue("E_CTYPE_FORMAT", `${path}/layout`, "connector type needs integer layout rows and cols"));
    }
    if (!Array.isArray(type.positions) || type.positions.length === 0) {
      errors.push(issue("E_CTYPE_FORMAT", `${path}/positions`, "connector type needs at least one position"));
      continue;
    }
    const ids = new Set();
    const cells = new Set();
    for (const [index, position] of type.positions.entries()) {
      const positionPath = `${path}/positions/${index}`;
      if (!/^[a-z0-9_]+$/.test(position.id ?? "")) errors.push(issue("E_CTYPE_FORMAT", `${positionPath}/id`, "position ID must be lowercase ASCII"));
      if (ids.has(position.id)) errors.push(issue("E_CTYPE_FORMAT", `${positionPath}/id`, `duplicate position ${position.id}`));
      ids.add(position.id);
      const cell = `${position.row}:${position.col}`;
      if (!Number.isInteger(position.row) || !Number.isInteger(position.col) || position.row < 0 || position.col < 0) {
        errors.push(issue("E_CTYPE_FORMAT", positionPath, "position row and col must be non-negative integers"));
      } else if (cells.has(cell)) errors.push(issue("E_CTYPE_FORMAT", positionPath, `layout cell ${cell} is duplicated`));
      else if (position.row >= type.layout.rows || position.col >= type.layout.cols) errors.push(issue("E_CTYPE_FORMAT", positionPath, "position is outside the declared layout"));
      cells.add(cell);
    }
    for (const field of ["fixed_positions", "default_positions"]) {
      for (const position of Object.keys(type[field] ?? {})) {
        if (!ids.has(position)) errors.push(issue("E_CTYPE_FORMAT", `${path}/${field}/${position}`, "position does not exist in this connector type"));
      }
    }
    for (const position of Object.keys(type.fixed_positions ?? {})) {
      if (ctypeOwn(type.default_positions ?? {}, position)) errors.push(issue("E_CTYPE_FORMAT", `${path}/default_positions/${position}`, "default and fixed positions must not overlap"));
    }
    for (const [standard, positions] of Object.entries(type.standards ?? {})) {
      for (const position of Object.keys(positions)) if (!ids.has(position)) {
        errors.push(issue("E_CTYPE_FORMAT", `${path}/standards/${standard}/${position}`, "standard refers to an unknown position"));
      }
    }
  }

  for (const [id, type] of Object.entries(types ?? {})) {
    if (!type?.extends) continue;
    const parent = types[type.extends];
    if (!parent) {
      errors.push(issue("E_CTYPE_EXTENDS", `/${id}/extends`, `missing parent connector type ${type.extends}`));
      continue;
    }
    if (parent.extends) errors.push(issue("E_CTYPE_EXTENDS", `/${id}/extends`, "multi-level connector type inheritance is not supported"));
    const childPositions = new Set((type.positions ?? []).map((position) => position.id));
    for (const position of parent.positions ?? []) {
      const childPosition = (type.positions ?? []).find((item) => item.id === position.id);
      if (!childPosition) errors.push(issue("E_CTYPE_EXTENDS", `/${id}/positions`, `inherited position ${position.id} is missing`));
      else if ((position.name ?? null) !== (childPosition.name ?? null)) {
        errors.push(issue("E_CTYPE_EXTENDS", `/${id}/positions/${position.id}`, "inherited position meaning must be preserved"));
      }
    }
    for (const [position, endpoint] of Object.entries(parent.fixed_positions ?? {})) {
      if (type.fixed_positions?.[position] !== endpoint) {
        errors.push(issue("E_CTYPE_EXTENDS", `/${id}/fixed_positions/${position}`, "inherited fixed position must be preserved"));
      }
    }
  }
  return uniqueCtypeErrors(errors);
}

function resolveConnectorType(types, id) {
  const type = types?.[id];
  if (!type) return null;
  if (!type.extends || !types[type.extends]) return clone(type);
  const parent = types[type.extends];
  return {
    ...clone(parent),
    ...clone(type),
    layout: { ...clone(parent.layout ?? {}), ...clone(type.layout ?? {}) },
    fixed_positions: { ...clone(parent.fixed_positions ?? {}), ...clone(type.fixed_positions ?? {}) },
    default_positions: { ...clone(parent.default_positions ?? {}), ...clone(type.default_positions ?? {}) },
    standards: { ...clone(parent.standards ?? {}), ...clone(type.standards ?? {}) },
    rails: [...new Set([...(parent.rails ?? []), ...(type.rails ?? [])])],
  };
}

function isCompatible(types, typeId, expectedId) {
  if (typeId === expectedId) return true;
  return types?.[typeId]?.extends === expectedId;
}


// lib/emit/m5unified_pin_table.js
const PIN_NAMES = [
  "in_i2c_scl", "in_i2c_sda",
  "port_a_pin1", "port_a_pin2", "port_b_pin1", "port_b_pin2",
  "port_c_pin1", "port_c_pin2", "port_d_pin1", "port_d_pin2",
  "port_e_pin1", "port_e_pin2",
  "sd_mmc_clk", "sd_mmc_cmd", "sd_mmc_d0", "sd_mmc_d1", "sd_mmc_d2", "sd_mmc_d3",
  "rgb_led", "power_hold",
  ...Array.from({ length: 30 }, (_, index) => `mbus_pin${index + 1}`),
];

const PIN_TABLE_GROUPS = [
  { name: "_pin_table_i2c_ex_in", pins: PIN_NAMES.slice(0, 4), unknown: [22, 21, 33, 32] },
  { name: "_pin_table_port_bc", pins: PIN_NAMES.slice(4, 8), unknown: [255, 255, 255, 255] },
  { name: "_pin_table_port_de", pins: PIN_NAMES.slice(8, 12), unknown: [255, 255, 255, 255] },
  { name: "_pin_table_sd", pins: PIN_NAMES.slice(12, 18), unknown: [255, 255, 255, 255, 255, 255] },
  { name: "_pin_table_other0", pins: ["rgb_led"], unknown: [255] },
  { name: "_pin_table_other1", pins: ["power_hold"], unknown: [255] },
  { name: "_pin_table_mbus", pins: PIN_NAMES.slice(20), unknown: Array(30).fill(255) },
];

const PIN_TABLE_TARGETS = {
  esp32: { soc: "esp32", define: "CONFIG_IDF_TARGET_ESP32", unknown: {} },
  esp32s3: {
    soc: "esp32s3",
    define: "CONFIG_IDF_TARGET_ESP32S3",
    unknown: { _pin_table_i2c_ex_in: [39, 38, 1, 2] },
  },
};

function stripRoleSource(role) {
  const slash = role.indexOf("/");
  return slash === -1 ? role : role.slice(slash + 1);
}

// This is the single role-to-pin_name_t mapping used by emission and validation.
function pinNameForRole(board, sourceRole) {
  const role = stripRoleSource(sourceRole);
  const bus = /^bus:([a-z][a-z0-9_]*)\.([a-z0-9_]+)$/.exec(role);
  if (bus?.[1] === "internal_i2c" && (bus[2] === "scl" || bus[2] === "sda")) return `in_i2c_${bus[2]}`;
  if (bus?.[1] === "main_spi" && Object.values(board.devices ?? {}).some((device) => device.kind === "sd" && device.bus === "main_spi")) {
    return { sclk: "sd_mmc_clk", mosi: "sd_mmc_cmd", miso: "sd_mmc_d0" }[bus[2]] ?? null;
  }

  const connector = /^conn:(port_[a-e]|port_b2|port_c2)\.([12])$/.exec(role);
  if (connector) {
    const port = { port_b2: "port_d", port_c2: "port_e" }[connector[1]] ?? connector[1];
    return `${port}_pin${connector[2]}`;
  }
  const mbus = /^conn:mbus\.([1-9]|[12][0-9]|30)$/.exec(role);
  if (mbus) return `mbus_pin${mbus[1]}`;

  const device = /^dev:([a-z][a-z0-9_]*)\.([a-z0-9_]+)$/.exec(role);
  const kind = device && board.devices?.[device[1]]?.kind;
  if (kind === "sd") return {
    clk: "sd_mmc_clk", cmd: "sd_mmc_cmd", d0: "sd_mmc_d0",
    d1: "sd_mmc_d1", d2: "sd_mmc_d2", d3: "sd_mmc_d3",
  }[device[2]] ?? null;
  if (kind === "led_strip" && device[2] === "data") return "rgb_led";
  if (kind === "power_hold" && device[2] === "enable") return "power_hold";
  return null;
}

function consumesPinTableRole(board, role) {
  return pinNameForRole(board, role) !== null;
}

function pinTableAssignments(board) {
  const assignments = {};
  for (const [gpio, pin] of Object.entries(board.pins ?? {})) for (const role of pin.roles ?? []) {
    const name = pinNameForRole(board, role);
    if (name) {
      if (assignments[name] !== undefined && assignments[name] !== Number(gpio)) {
        throw new Error(`${board.id}: ${name} is assigned to both GPIO ${assignments[name]} and GPIO ${gpio}`);
      }
      assignments[name] = Number(gpio);
    }
  }
  return assignments;
}

function emitPinTable(board, target = {}) {
  const assignments = pinTableAssignments(board);
  const values = Object.fromEntries(PIN_NAMES.map((name) => [name, assignments[name] ?? 255]));
  const overrides = target.overrides?.[board.id] ?? {};
  for (const [name, override] of Object.entries(overrides)) {
    if (!PIN_NAMES.includes(name)) throw new Error(`unknown pin-table override ${board.id}.${name}`);
    if (!Number.isInteger(override?.value) || override.value < 0 || override.value > 255 || typeof override.reason !== "string" || !override.reason) {
      throw new Error(`invalid pin-table override ${board.id}.${name}`);
    }
    values[name] = override.value;
  }
  return { values, overrides };
}

function sameValues(left, right) {
  return left.length === right.length && left.every((value, index) => value === right[index]);
}

function renderPinTableJson(entries) {
  return `${JSON.stringify(Object.fromEntries(entries.map(({ board, emitted }) => [board.id, emitted.values])), null, 2)}\n`;
}

function renderPinTableInl(entries, targetId = "esp32", boardTarget = {}) {
  const target = PIN_TABLE_TARGETS[targetId];
  if (!target) throw new Error(`unknown pin-table target ${targetId}`);
  const lines = [
    "// Generated from extras/board_spec; do not edit.",
    "// Unspecified values use target-specific unknown or sentinel values.",
    "// Precedence: board value > part default > panel-class default.",
  ];
  for (const group of PIN_TABLE_GROUPS) {
    const unknown = target.unknown[group.name] ?? group.unknown;
    lines.push("", `// ${group.name}[][${group.pins.length + 1}]`);
    for (const { board, emitted } of entries) {
      const values = group.pins.map((name) => emitted.values[name]);
      if (sameValues(values, unknown)) continue;
      const comments = group.pins
        .filter((name) => emitted.overrides[name])
        .map((name) => `${name}: ${emitted.overrides[name].reason}`);
      const suffix = comments.length ? ` // override: ${comments.join("; ")}` : "";
      const boardEnum = boardTarget.boards?.[board.id]?.board_enum;
      if (!boardEnum) throw new Error(`missing board enum for ${board.id}`);
      lines.push(`{ board_t::${boardEnum}, ${values.join(", ")} },${suffix}`);
    }
    lines.push(`{ board_t::board_unknown, ${unknown.join(", ")} },`);
  }
  return `${lines.join("\n")}\n`;
}


// lib/emit/m5gfx_board_wiring.js
function m5gfxBoardMapping(target, boardId) {
  const source = target.boards?.[boardId];
  if (!source?.wiring_output) return null;
  return {
    boardId,
    chip: source.chip,
    cppNamespace: source.cpp_namespace,
    boardEnum: source.board_enum,
    descName: source.desc_name,
    fields: source.wiring_fields ?? [],
    reset: source.reset,
    wiringOutput: source.wiring_output,
    specsOutput: source.specs_output,
    options: source.options ?? [],
  };
}

// M5GFX board detection intentionally consumes only the base-board wiring.
// Accessory/composition wiring is not an input to these board descriptors.

function stripWiringRoleSource(role) {
  const slash = role.indexOf("/");
  return slash === -1 ? role : role.slice(slash + 1);
}

function requireWiringParts(parts) {
  if (!parts || typeof parts !== "object" || Array.isArray(parts)) throw new TypeError("M5GFX wiring generation requires the parts catalog");
  return parts;
}

// This is the single role-to-wiring-field mapping used by emission and validation.
function wiringFieldsForRole(board, sourceRole, parts) {
  requireWiringParts(parts);
  const role = stripWiringRoleSource(sourceRole);
  const fields = [];
  const bus = /^bus:([a-z][a-z0-9_]*)\.([a-z0-9_]+)$/.exec(role);
  if (bus) {
    const display = Object.values(board.devices ?? {}).find((device) => device.kind === "display");
    const sd = Object.values(board.devices ?? {}).find((device) => device.kind === "sd");
    if (display?.bus === bus[1] && ["sclk", "mosi", "miso"].includes(bus[2])) fields.push(`display_${bus[2]}`);
    if (sd?.bus === display?.bus && sd.bus === bus[1]) {
      const name = { sclk: "shared_sd_sclk", mosi: "shared_sd_mosi", miso: "shared_sd_miso" }[bus[2]];
      if (name) fields.push(name);
    }
    if (bus[1] === "internal_i2c" && (bus[2] === "sda" || bus[2] === "scl")) fields.push(`internal_i2c_${bus[2]}`);
  }

  const deviceRole = /^dev:([a-z][a-z0-9_]*)\.([a-z0-9_]+)$/.exec(role);
  const displayId = Object.entries(board.devices ?? {}).find(([, device]) => device.kind === "display")?.[0];
  const sdId = Object.entries(board.devices ?? {}).find(([, device]) => device.kind === "sd")?.[0];
  const kind = deviceRole && board.devices?.[deviceRole[1]]?.kind;
  if (kind === "display" && deviceRole[1] === displayId) {
    const name = { dc: "display_dc", cs: "display_cs", rst: "display_rst", busy: "display_busy" }[deviceRole[2]];
    if (name) fields.push(name);
  }
  if (kind === "sd" && deviceRole[1] === sdId && board.devices[sdId].bus === board.devices[displayId]?.bus) {
    const spiSignal = parts[board.devices[sdId].part]?.spi_alias?.[deviceRole[2]];
    const name = { sclk: "shared_sd_sclk", mosi: "shared_sd_mosi", miso: "shared_sd_miso", cs: "shared_sd_sd_cs" }[spiSignal];
    if (name) fields.push(name);
  }
  if (kind === "power_hold" && deviceRole[2] === "enable") fields.push("power_gpio");
  if (kind === "backlight" && deviceRole[2] === "pwm") fields.push("backlight_gpio");
  if (kind === "touch" && deviceRole[2] === "int") fields.push("touch_int");
  return fields;
}

function wiringAssignments(board, parts) {
  requireWiringParts(parts);
  const values = {};
  for (const [gpio, pin] of Object.entries(board.pins ?? {})) for (const role of pin.roles ?? []) {
    for (const field of wiringFieldsForRole(board, role, parts)) {
      if (values[field] !== undefined && values[field] !== Number(gpio)) {
        throw new Error(`${board.id}: ${field} is assigned to both GPIO ${values[field]} and GPIO ${gpio}`);
      }
      values[field] = Number(gpio);
    }
  }
  return values;
}

function emitM5GFXWiring(board, parts, target) {
  requireWiringParts(parts);
  const mapping = m5gfxBoardMapping(target, board.id);
  if (!mapping) return null;
  return emitM5GFXWiringForMapping(board, parts, mapping);
}

function emitM5GFXWiringForMapping(board, parts, mapping) {
  requireWiringParts(parts);
  const assigned = wiringAssignments(board, parts);
  const value = (name) => assigned[name] ?? -1;
  const display = Object.fromEntries(["sclk", "mosi", "miso", "dc", "cs", "rst", "busy"].map((name) => [name, value(`display_${name}`)]));
  const displayDevice = Object.values(board.devices ?? {}).find((device) => device.kind === "display");
  const sdDevice = Object.values(board.devices ?? {}).find((device) => device.kind === "sd");
  const sharesSdBus = sdDevice && sdDevice.bus === displayDevice?.bus;
  if (sharesSdBus && !sdDevice.derived?.modes?.includes("spi")) {
    throw new Error(`${board.id}: SD shares the display bus but does not support SPI`);
  }
  const sharedSd = sharesSdBus ? {
    sclk: value("shared_sd_sclk"), mosi: value("shared_sd_mosi"), miso: value("shared_sd_miso"),
    sd_cs: value("shared_sd_sd_cs"), other_cs: display.cs,
  } : null;
  const preferredHost = board.buses?.internal_i2c?.preferred_host;
  if (mapping.fields.includes("i2c") && (!Number.isInteger(preferredHost) || preferredHost < 0 || preferredHost > 127)) {
    throw new Error(`${board.id}: internal_i2c.preferred_host must be an integer from 0 to 127`);
  }
  const i2c = board.buses?.internal_i2c ? {
    sda: value("internal_i2c_sda"), scl: value("internal_i2c_scl"), port: preferredHost ?? -1,
  } : null;
  let resetGpio = -1;
  if (mapping.reset === "display_rst") {
    if (display.rst < 0) throw new Error(`${board.id}: reset uses display_rst but the display reset GPIO is unavailable`);
    resetGpio = display.rst;
  }
  const hold = sharedSd ? [sharedSd.sd_cs, display.cs] : [display.cs];
  return {
    mapping,
    display,
    sharedSd,
    i2c,
    resetGpio,
    powerGpio: value("power_gpio"),
    backlightGpio: value("backlight_gpio"),
    touchInt: value("touch_int"),
    hold: hold.filter((pin) => pin >= 0),
  };
}

function constant(name, value) {
  return `constexpr std::int8_t ${name} = ${value};`;
}

function renderM5GFXWiringHeader(entries) {
  const lines = [
    "// Generated from extras/board_spec; do not edit by hand.",
    "// Unspecified values use target-specific unknown or sentinel values.",
    "// Precedence: board value > part default > panel-class default.",
    "#pragma once",
    "",
    "#include <cstdint>",
    "",
    "namespace m5gfx { namespace board_detect { namespace m5 { namespace wiring {",
  ];
  for (const entry of entries) {
    const value = entry.emitted;
    const fields = new Set(value.mapping.fields);
    lines.push("", `namespace ${value.mapping.cppNamespace} {`);
    if (fields.has("display")) for (const [name, pin] of Object.entries(value.display)) lines.push(`  ${constant(`display_${name}`, pin)}`);
    if (fields.has("shared_sd") && value.sharedSd) for (const [name, pin] of Object.entries(value.sharedSd)) lines.push(`  ${constant(`shared_sd_${name}`, pin)}`);
    if (fields.has("i2c") && value.i2c) {
      lines.push(`  ${constant("internal_i2c_sda", value.i2c.sda)}`);
      lines.push(`  ${constant("internal_i2c_scl", value.i2c.scl)}`);
      lines.push(`  ${constant("internal_i2c_port", value.i2c.port)}`);
    }
    if (value.mapping.reset) lines.push(`  ${constant("reset_gpio", value.resetGpio)}`);
    if (fields.has("power")) lines.push(`  ${constant("power_gpio", value.powerGpio)}`);
    if (fields.has("backlight")) lines.push(`  ${constant("backlight_gpio", value.backlightGpio)}`);
    if (fields.has("touch")) lines.push(`  ${constant("touch_int", value.touchInt)}`);
    if (fields.has("hold")) lines.push(`  constexpr std::int8_t hold[] = { ${value.hold.join(", ")} };`);
    lines.push(`} // namespace ${value.mapping.cppNamespace}`);
  }
  lines.push("", "} // namespace wiring");
  const optionEntries = entries.filter(({ emitted }) => emitted.mapping.options.length);
  if (optionEntries.length) {
    lines.push("", "namespace generated_options {");
    for (const { emitted } of optionEntries) {
      const { cppNamespace } = emitted.mapping;
      const options = [...emitted.mapping.options].sort((left, right) => left.bit - right.bit);
      lines.push(`namespace ${cppNamespace} {`);
      for (const option of options) lines.push(`  constexpr std::uint32_t ${option.name} = 1u << ${option.bit};`);
      lines.push(`  static const char* const names[] = { ${options.map((option) => `"${option.name}"`).join(", ")} };`);
      lines.push(`} // namespace ${cppNamespace}`);
    }
    lines.push("} // namespace generated_options");
  }
  lines.push("", "} } } // namespace m5gfx::board_detect::m5", "");
  return lines.join("\n");
}

function selectM5GFXWiringBoards(boards, mappings) {
  return mappings.map((mapping) => {
    const matches = boards.filter((board) => board.id === mapping.boardId);
    if (matches.length !== 1) throw new Error(`M5GFX wiring board ${mapping.boardId} must appear exactly once; found ${matches.length}`);
    return matches[0];
  });
}


// lib/pintable_roles.js

function isPintableRole(board, role) {
  return consumesPinTableRole(board, role);
}

function stripSource(role) {
  return stripRoleSource(role);
}

function pintableRoleName(board, role) {
  return pinNameForRole(board, role);
}

function pintableAssignments(board) {
  return pinTableAssignments(board);
}

function pinRowIsConsumed(board, pin) {
  // main_spi is also consumed by the M5GFX descriptor target when no SD device
  // makes it part of the M5Unified table.
  return Array.isArray(pin?.roles) && pin.roles.some((role) => (
    isPintableRole(board, role) || /^bus:main_spi\./.test(stripSource(role))
  ));
}

function isGeneratedField(board, objectPath, field) {
  const pinMatch = /^\/pins\/([^/]+)$/.exec(objectPath);
  if (pinMatch) {
    return field === "roles" && pinRowIsConsumed(board, board.pins?.[pinMatch[1]]);
  }

  const busMatch = /^\/buses\/([^/]+)$/.exec(objectPath);
  if (busMatch) {
    const generatedByKind = {
      spi: new Set(["signals", "preferred_host", "freq", "freq_read"]),
      i2c: new Set(["signals", "preferred_host", "freq"]),
    };
    return generatedByKind[board.buses?.[busMatch[1]]?.kind]?.has(field) ?? false;
  }

  const deviceMatch = /^\/devices\/([^/]+)$/.exec(objectPath);
  if (!deviceMatch) return false;
  const generatedByKind = {
    display: new Set(["signals"]),
    sd: new Set(["bus", "signals", "derived"]),
    touch: new Set(["signals"]),
    pmic: new Set([]),
    speaker: new Set(["enable"]),
    led_strip: new Set(["signals"]),
    power_hold: new Set(["signals"]),
    backlight: new Set(["signals", "spec"]),
  };
  return generatedByKind[board.devices?.[deviceMatch[1]]?.kind]?.has(field) ?? false;
}


// lib/choices.js

const choiceOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);

function choiceSlots(board, selectedBy = null) {
  return Object.entries(board.devices ?? {}).filter(([, device]) => (
    isPlainObject(device.choices) && (selectedBy === null || device.selected_by === selectedBy)
  ));
}

function revisionSelection(board, revision = null) {
  const selected = {};
  for (const [id, device] of choiceSlots(board)) selected[id] = device.default;
  for (const [id, choice] of Object.entries(revision?.select ?? {})) selected[id] = choice;
  return selected;
}

function mergeChoice(device, choiceId) {
  const fragment = device.choices?.[choiceId] ?? {};
  const base = clone(device);
  delete base.choices;
  delete base.selected_by;
  delete base.default;
  return { ...base, ...clone(fragment) };
}

function materializeChoices(board, selection = {}) {
  const resolved = clone(board);
  for (const [id, device] of Object.entries(resolved.devices ?? {})) {
    if (!isPlainObject(device.choices)) continue;
    resolved.devices[id] = mergeChoice(device, selection[id] ?? device.default);
  }
  delete resolved.revisions;
  return resolved;
}

function runtimeCombinations(board) {
  let combinations = [{}];
  for (const [id, device] of choiceSlots(board, "runtime")) {
    combinations = combinations.flatMap((selection) => Object.keys(device.choices).map((choice) => ({ ...selection, [id]: choice })));
  }
  return combinations;
}

function validateChoices(board) {
  const issues = [];
  const issue = (id, path, message, severity) => issues.push({ id, path, message, ...(severity ? { severity } : {}) });
  for (const [id, device] of choiceSlots(board)) {
    const path = `/devices/${id}`;
    const choices = Object.keys(device.choices);
    if (!choices.includes(device.default)) issue("E_CHOICE_DEFAULT", `${path}/default`, `default ${device.default ?? "<missing>"} is not a choice`);
    if (choices.length === 1) issue("W_CHOICE_SINGLE", `${path}/choices`, "a single choice does not need a choice slot", "warning");
    for (const [choiceId, fragment] of Object.entries(device.choices)) {
      for (const key of Object.keys(fragment)) if (choiceOwn(device, key) && !["choices", "selected_by", "default"].includes(key)) {
        issue("E_CHOICE_KEY_OVERLAP", `${path}/choices/${choiceId}/${key}`, `${key} is also present on the device`);
      }
      if (choiceOwn(fragment, "soc_pins")) issue("E_UNKNOWN_KEY", `${path}/choices/${choiceId}/soc_pins`, "choice fragments cannot change SoC pins");
    }
  }
  const revisionIds = new Set();
  for (const [index, revision] of (board.revisions ?? []).entries()) {
    const path = `/revisions/${index}`;
    if (revisionIds.has(revision.id)) issue("E_ID_FORMAT", `${path}/id`, `duplicate revision ${revision.id}`);
    revisionIds.add(revision.id);
    for (const [slot, choice] of Object.entries(revision.select ?? {})) {
      const device = board.devices?.[slot];
      if (!device?.choices || !choiceOwn(device.choices, choice)) issue("E_REV_SELECT_UNKNOWN", `${path}/select/${slot}`, `${slot}:${choice} is not a known choice`);
      else if (device.selected_by === "runtime") issue("E_REV_SELECT_RUNTIME", `${path}/select/${slot}`, `${slot} is selected at runtime`);
    }
  }
  return issues;
}


// lib/owners.js

const outputCaps = new Set(["output", "pwm", "rail", "ldo"]);

function parseRole(role) {
  role = stripSource(role);
  const match = /^(bus|dev|conn|pwr):([a-z0-9_]+)(?:\.([a-z0-9_]+))?$/.exec(role);
  if (!match || (match[1] !== "pwr" && !match[3]) || (match[1] === "pwr" && match[3])) return null;
  return { type: match[1], id: match[2], signal: match[3] };
}

function ownerRoleEntries(board) {
  const entries = [];
  for (const [pin, row] of Object.entries(board.pins ?? {})) for (const role of row.roles ?? []) {
    entries.push({ owner: "soc", pin, row, role, parsed: parseRole(role), path: `/pins/${pin}/roles`, endpoint: `gpio:${pin}` });
  }
  for (const [owner, device] of Object.entries(board.devices ?? {})) for (const [pin, row] of Object.entries(device.pins ?? {})) for (const role of row.roles ?? []) {
    entries.push({ owner, pin, row, role, parsed: parseRole(role), path: `/devices/${owner}/pins/${pin}/roles`, endpoint: `pin:${owner}.${pin}` });
  }
  return entries;
}

function deriveDeviceEndpoints(board) {
  for (const device of Object.values(board.devices ?? {})) {
    delete device.signals;
    delete device.enable;
  }
  for (const entry of ownerRoleEntries(board)) {
    if (entry.parsed?.type !== "dev") continue;
    const device = board.devices?.[entry.parsed.id];
    if (!device) continue;
    if (device.kind === "speaker" && entry.parsed.signal === "enable") device.enable = entry.endpoint;
    else {
      if (!device.signals) device.signals = {};
      device.signals[entry.parsed.signal] = entry.endpoint;
    }
  }
  return board;
}

function validateOwners(board, parts) {
  const issues = [];
  const issue = (id, path, message) => issues.push({ id, path, message });
  for (const [owner, device] of Object.entries(board.devices ?? {})) {
    if (!device.pins) continue;
    const part = parts?.[device.part] ?? (!device.part ? parts?.[device.kind] : null);
    if (!part?.pins) {
      issue("E_OWNER_NO_PART", `/devices/${owner}/pins`, "pin owner must reference a part with pins");
      continue;
    }
    for (const [pin, row] of Object.entries(device.pins)) {
      const definition = part.pins[pin];
      if (!definition) {
        issue("E_OWNER_PIN_UNKNOWN", `/devices/${owner}/pins/${pin}`, `${pin} is not declared by part ${device.part ?? device.kind}`);
        continue;
      }
      const caps = new Set(definition.cap ?? []);
      for (const role of row.roles ?? []) {
        const parsed = parseRole(role);
        const needsRail = parsed?.type === "pwr";
        const needsOutput = parsed?.type === "dev" || parsed?.type === "conn";
        if ((needsRail && !["rail", "ldo", "output"].some((cap) => caps.has(cap))) || (needsOutput && ![...caps].some((cap) => outputCaps.has(cap)))) {
          issue("E_OWNER_CAP", `/devices/${owner}/pins/${pin}/roles`, `${pin} lacks capability for ${role}`);
        }
      }
    }
  }
  return issues;
}

function normalizeEndpoint(endpoint) {
  const gpio = /^pin:soc\.(\d+)$/.exec(endpoint)?.[1];
  return gpio === undefined ? endpoint : `gpio:${gpio}`;
}


// lib/parts.js

function busKind(board, device) {
  return device.bus ? board.buses?.[device.bus]?.kind : "none";
}

function validatePartCatalog(parts) {
  const issues = [];
  const cppTypes = {
    integer: new Set(["int", "std::int8_t", "std::int16_t", "std::int32_t", "std::uint8_t", "std::uint16_t", "std::uint32_t"]),
    number: new Set(["float", "double"]),
    boolean: new Set(["bool", "int"]),
    string: new Set(["const char*"]),
  };
  for (const [id, part] of Object.entries(parts ?? {})) {
    if (!/^[a-z][a-z0-9_]*$/.test(id) || part.id !== id || typeof part.name !== "string" || typeof part.kind !== "string") {
      issues.push({ id: "E_PART_FORMAT", path: `/${id}`, message: "part needs a matching lowercase ID, name, and kind" });
    }
    if (part.spec_keys !== undefined && (!part.spec_keys || Array.isArray(part.spec_keys) || typeof part.spec_keys !== "object")) {
      issues.push({ id: "E_PART_FORMAT", path: `/${id}/spec_keys`, message: "spec_keys must map keys to schema definitions" });
      continue;
    }
    for (const [key, definition] of Object.entries(part.spec_keys ?? {})) {
      const path = `/${id}/spec_keys/${key}`;
      if (!definition || Array.isArray(definition) || typeof definition !== "object" || typeof definition.type !== "string") {
        issues.push({ id: "E_PART_SPEC_DEF", path, message: "spec definition needs a scalar type" });
        continue;
      }
      if (Object.prototype.hasOwnProperty.call(definition, "default")) {
        issues.push(...validateSchema(definition.default, definition, definition, `${path}/default`));
      }
      if (definition["x-cpp-type"] !== undefined && !cppTypes[definition.type]?.has(definition["x-cpp-type"])) {
        issues.push({ id: "E_PART_CPP_TYPE", path: `${path}/x-cpp-type`, message: `${definition["x-cpp-type"]} is incompatible with ${definition.type}` });
      }
    }
  }
  return issues;
}

function validateSpec(spec, part, path, issues) {
  const definitions = part.spec_keys ?? {};
  for (const [key, value] of Object.entries(spec ?? {})) {
    const definition = definitions[key];
    if (!definition) {
      issues.push({ id: "E_UNKNOWN_KEY", path: `${path}/${key}`, message: `${key} is not declared by ${part.id}` });
      continue;
    }
    issues.push(...validateSchema(value, definition, definition, `${path}/${key}`));
  }
}

function validateParts(board, parts, { resolved = true } = {}) {
  const issues = [];
  const issue = (id, path, message, severity) => issues.push({ id, path, message, ...(severity ? { severity } : {}) });
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    const path = `/devices/${id}`;
    const fragments = [[device, path], ...Object.entries(device.choices ?? {}).map(([choice, fragment]) => [
      { ...device, ...fragment, choices: undefined, selected_by: undefined, default: undefined }, `${path}/choices/${choice}`,
    ])];
    for (const [fragment, fragmentPath] of fragments) {
      if (!fragment.part) continue;
      const part = parts?.[fragment.part];
      if (!part) {
        issue("E_PART_MISSING", `${fragmentPath}/part`, `part ${fragment.part} is not in the catalog`);
        continue;
      }
      if (part.kind !== fragment.kind) issue("E_PART_KIND", `${fragmentPath}/part`, `${fragment.part} is ${part.kind}, not ${fragment.kind}`);
      const expectedBus = part.bus?.kind;
      const actualBus = busKind(board, fragment);
      if (expectedBus && expectedBus !== "any" && expectedBus !== actualBus) issue("E_PART_BUS_KIND", `${fragmentPath}/bus`, `${fragment.part} expects ${expectedBus}, got ${actualBus}`);
      if (fragment.i2c_addr && Array.isArray(part.i2c_addr) && !part.i2c_addr.includes(fragment.i2c_addr)) {
        issue("W_PART_ADDR_UNUSUAL", `${fragmentPath}/i2c_addr`, `${fragment.i2c_addr} is unusual for ${fragment.part}`, "warning");
      }
      validateSpec(fragment.spec, part, `${fragmentPath}/spec`, issues);
      if (!resolved || fragmentPath !== path) continue;
      const wired = new Set(Object.keys(fragment.signals ?? {}));
      if (fragment.enable) wired.add("enable");
      for (const signal of part.signals?.required ?? []) if (!wired.has(signal)) issue("E_PART_SIGNAL_MISSING", `${fragmentPath}/signals/${signal}`, `${fragment.part} requires ${signal}`);
      const known = new Set([...(part.signals?.required ?? []), ...(part.signals?.optional ?? [])]);
      if (known.size) for (const signal of wired) if (!known.has(signal)) issue("E_PART_SIGNAL_UNKNOWN", `${fragmentPath}/signals/${signal}`, `${signal} is not declared by ${fragment.part}`);
    }
  }
  return issues;
}


// lib/targets.js

const WIRING_FIELDS = new Set(["display", "shared_sd", "i2c", "power", "backlight", "touch", "hold"]);
const CPP_IDENTIFIER = /^[A-Za-z_][A-Za-z0-9_]*$/;
const OUTPUT_FILENAME = /^[A-Za-z0-9_][A-Za-z0-9_.-]*\.hpp$/;

function targetBoard(target, boardId) {
  return target.boards?.[boardId] ?? null;
}

function targetOptions(target, boardId) {
  return targetBoard(target, boardId)?.options ?? [];
}

function validateTarget(board, target = {}) {
  const issues = [];
  const issue = (id, path, message, severity) => issues.push({ id, path, message, ...(severity ? { severity } : {}) });
  const boardTarget = targetBoard(target, board.id);
  const boardPath = `/targets/boards/${board.id}`;
  if (!boardTarget) {
    issue("E_TGT_BOARD_MISSING", boardPath, "board has no target metadata");
    return issues;
  }
  if (boardTarget.chip !== board.chip) issue("E_TGT_CHIP", `${boardPath}/chip`, `${boardTarget.chip} does not match ${board.chip}`);
  if (boardTarget.legacy_board_id !== board.legacy_board_id) issue("E_TGT_LEGACY_ID", `${boardPath}/legacy_board_id`, `${boardTarget.legacy_board_id} does not match ${board.legacy_board_id}`);
  if (typeof boardTarget.board_enum !== "string" || !/^board_[A-Za-z][A-Za-z0-9_]*$/.test(boardTarget.board_enum)) {
    issue("E_TGT_BOARD_ENUM", `${boardPath}/board_enum`, "board_enum must be a board_ C++ identifier");
  }
  for (const field of ["cpp_namespace", "desc_name"]) if (boardTarget[field] !== undefined && !CPP_IDENTIFIER.test(boardTarget[field])) {
    issue("E_TGT_CPP_IDENTIFIER", `${boardPath}/${field}`, `${field} must be a C++ identifier`);
  }
  if (!Array.isArray(boardTarget.wiring_fields ?? [])) issue("E_TGT_WIRING_FIELD", `${boardPath}/wiring_fields`, "wiring_fields must be an array");
  else {
    const seenFields = new Set();
    for (const field of boardTarget.wiring_fields ?? []) {
      if (!WIRING_FIELDS.has(field) || seenFields.has(field)) issue("E_TGT_WIRING_FIELD", `${boardPath}/wiring_fields`, `${field} is unknown or duplicated`);
      seenFields.add(field);
    }
  }
  for (const field of ["wiring_output", "specs_output"]) if (boardTarget[field] !== undefined && !OUTPUT_FILENAME.test(boardTarget[field])) {
    issue("E_TGT_OUTPUT", `${boardPath}/${field}`, `${field} must be a safe .hpp filename`);
  }
  if (boardTarget.wiring_output && (!boardTarget.cpp_namespace || !boardTarget.desc_name)) {
    issue("E_TGT_GENERATION_FIELDS", boardPath, "generated wiring requires cpp_namespace and desc_name");
  }
  const options = targetOptions(target, board.id);
  const slots = new Set();
  const selections = new Map();
  const names = new Set();
  const bits = new Map();
  for (const [index, option] of options.entries()) {
    const path = `/targets/boards/${board.id}/options/${index}`;
    if (typeof option.name !== "string" || !/^[a-z][a-z0-9_]*$/.test(option.name) || names.has(option.name)) {
      issue("E_TGT_OPTION_NAME", `${path}/name`, "option name must be unique snake_case ASCII");
    }
    names.add(option.name);
    if (!Number.isInteger(option.bit) || option.bit < 0 || option.bit > 31) {
      issue("E_TGT_BIT_RANGE", `${path}/bit`, "option bit must be an integer from 0 to 31");
    } else if (bits.has(option.bit)) {
      issue("E_TGT_BIT_DUP", `${path}/bit`, `bit ${option.bit} is also used by ${bits.get(option.bit)}`);
    } else bits.set(option.bit, option.name);
    for (const [slot, choice] of Object.entries(option.select ?? {})) {
      const device = board.devices?.[slot];
      if (!device?.choices?.[choice]) issue("E_TGT_SELECT_UNKNOWN", `${path}/select/${slot}`, `${slot}:${choice} is not a board choice`);
      const selection = `${slot}\0${choice}`;
      if (selections.has(selection)) issue("E_TGT_SLOT_DUP", `${path}/select/${slot}`, `${slot}:${choice} is also selected by ${selections.get(selection)}`);
      else selections.set(selection, option.name);
      slots.add(slot);
    }
  }
  if (bits.size && [...bits.keys()].some((bit) => bit >= bits.size)) {
    issue("E_TGT_BIT_GAP", `/targets/boards/${board.id}/options`, "option bits must be contiguous from zero");
  }
  for (const [slot, device] of choiceSlots(board)) {
    if (device.selected_by === "runtime") {
      const represented = new Set(options.flatMap((option) => Object.entries(option.select ?? {}))
        .filter(([selectedSlot]) => selectedSlot === slot).map(([, choice]) => choice));
      for (const choice of Object.keys(device.choices).filter((choice) => choice !== device.default && !represented.has(choice))) {
        issue("E_TGT_CHOICE_UNREPRESENTED", `/devices/${slot}/choices/${choice}`, `${slot}:${choice} has no target option`);
      }
    }
    if (device.selected_by === "revision" && Object.keys(device.choices).length > 1 && !slots.has(slot)) {
      issue("W_TGT_REV_INDISTINGUISHABLE", `/devices/${slot}`, `${slot} revision choices are not represented by target options`, "warning");
    }
  }
  return issues;
}

function validateTargets(boards, target = {}) {
  const issues = [];
  const catalog = new Map(boards.map((board) => [board.id, board]));
  const enums = new Map();
  const namespaces = new Map();
  for (const [id, entry] of Object.entries(target.boards ?? {})) {
    const path = `/targets/boards/${id}`;
    if (!catalog.has(id)) issues.push({ id: "E_TGT_BOARD_UNKNOWN", path, message: `${id} is not in the board catalog` });
    for (const [field, seen] of [["board_enum", enums], ["cpp_namespace", namespaces]]) {
      const value = entry[field];
      if (!value) continue;
      if (seen.has(value)) issues.push({ id: field === "board_enum" ? "E_TGT_BOARD_ENUM_DUP" : "E_TGT_NAMESPACE_DUP", path: `${path}/${field}`, message: `${value} is also used by ${seen.get(value)}` });
      else seen.set(value, id);
    }
  }
  for (const board of boards) issues.push(...validateTarget(board, target));
  return issues;
}

function revisionOptions(board, revision, target = {}) {
  const explicit = revision?.select ?? {};
  return targetOptions(target, board.id).filter((option) => {
    const selections = Object.entries(option.select ?? {});
    return selections.length > 0 && selections.every(([slot, choice]) => (explicit[slot] ?? board.devices?.[slot]?.default) === choice);
  }).map((option) => option.name);
}

function renderRevisionDoc(board, target = {}) {
  if (!board.revisions?.length) return null;
  const lines = [
    `# ${board.name} revisions`,
    "",
    "| Revision | Choices | M5GFX options | Note |",
    "|---|---|---|---|",
  ];
  for (const revision of board.revisions) {
    const choices = Object.entries(revision.select ?? {}).map(([slot, choice]) => `${slot}=${choice}`).join(", ") || "defaults";
    const options = revisionOptions(board, revision, target).join(", ") || "none";
    lines.push(`| ${revision.name} | ${choices} | ${options} | ${revision.note ?? ""} |`);
  }
  return `${lines.join("\n")}\n`;
}


// lib/compose.js



const compIssue = (id, path, message, severity) => ({ id, path, message, ...(severity ? { severity } : {}) });

function selectedAccessory(accessory, settings, issues, path) {
  const value = clone(accessory);
  const hostPins = clone(value.host_pins ?? {});
  const staticPositions = new Set(Object.keys(hostPins));
  for (const id of Object.keys(settings ?? {})) if (!value.settings?.[id]) {
    issues.push(compIssue("E_COMP_SETTING_UNKNOWN", `${path}/settings/${id}`, `${id} is not a setting of ${value.id}`));
  }
  for (const [id, setting] of Object.entries(value.settings ?? {})) {
    const choice = settings?.[id] ?? setting.default;
    if (choice == null) {
      issues.push(compIssue("E_COMP_SETTING_REQUIRED", `${path}/settings/${id}`, `${id} requires an explicit choice`));
      continue;
    }
    if (!setting.choices?.[choice]) {
      issues.push(compIssue("E_COMP_SETTING_UNKNOWN", `${path}/settings/${id}`, `${choice} is not a choice for ${id}`));
      continue;
    }
    for (const [position, row] of Object.entries(setting.choices[choice].host_pins ?? {})) {
      if (staticPositions.has(position)) issues.push(compIssue("E_CHOICE_KEY_OVERLAP", `${path}/settings/${id}/choices/${choice}/host_pins/${position}`, `${position} is also static`));
      hostPins[position] = hostPins[position]
        ? { ...hostPins[position], ...clone(row), roles: [...(hostPins[position].roles ?? []), ...(row.roles ?? [])] }
        : clone(row);
    }
  }
  value.host_pins = hostPins;
  return value;
}

function renameRole(role, mapping) {
  const parsed = parseRole(role);
  if (!parsed || parsed.type === "pwr") return role;
  const id = mapping[parsed.id] ?? parsed.id;
  return `${parsed.type}:${id}.${parsed.signal}`;
}

function sourceRole(accessoryId, role, mapping) {
  return `${accessoryId}/${renameRole(role, mapping)}`;
}

function included(role, use) {
  if (!use) return true;
  const parsed = parseRole(role);
  return !parsed || parsed.type === "pwr" || use.has(parsed.id);
}

function sourceInfo(accessory) {
  return { accessory: accessory.id, origin: accessory.origin, bundled: accessory.bundled === true };
}

function compose(resolvedBoard, entries = [], catalogs = {}) {
  const board = clone(resolvedBoard);
  const issues = [];
  const occupied = [];
  const allowedOrigins = new Set(catalogs.allow_origins ?? ["official", "third_party", "virtual"]);

  for (const [index, entry] of entries.entries()) {
    const path = `/composition/accessories/${index}`;
    const catalog = catalogs.accessories?.[entry.id];
    if (!catalog) {
      issues.push(compIssue("E_COMP_INCOMPATIBLE", `${path}/id`, `accessory ${entry.id} is missing`));
      continue;
    }
    if (!allowedOrigins.has(catalog.origin)) issues.push(compIssue("E_COMP_ORIGIN", `${path}/id`, `origin ${catalog.origin} is not allowed`));
    const host = Object.entries(board.connectors ?? {}).find(([, connector]) => isCompatible(catalogs.connectorTypes, connector.type, catalog.attaches?.connector_type));
    if (!host || (catalog.compatible_with && !catalog.compatible_with.includes(board.id))) {
      issues.push(compIssue("E_COMP_INCOMPATIBLE", `${path}/id`, `${catalog.id} cannot attach to ${board.id}`));
      continue;
    }
    const occupies = catalog.attaches?.occupies ?? "stack";
    if ((occupies === "bottom" && occupied.includes("bottom")) || (occupies === "exclusive" && occupied.length) || (occupied.includes("exclusive"))) {
      issues.push(compIssue("E_COMP_BOTTOM_DUP", path, `${catalog.id} conflicts with another occupied attachment`));
    }
    if (occupies !== "none") occupied.push(occupies);

    const accessory = selectedAccessory(catalog, entry.settings, issues, path);
    const use = entry.use ? new Set(entry.use) : null;
    const mapping = entry.as ?? {};
    for (const [hostRef, row] of Object.entries(accessory.host_pins ?? {})) {
      const [connectorType, position] = hostRef.split(".");
      if (!isCompatible(catalogs.connectorTypes, host[1].type, connectorType)) {
        issues.push(compIssue("E_COMP_INCOMPATIBLE", `${path}/host_pins/${hostRef}`, `${hostRef} does not match host connector`));
        continue;
      }
      const endpoint = host[1].positions?.[position];
      const endpoints = Array.isArray(endpoint) ? endpoint : [endpoint];
      for (const item of endpoints) {
        const gpio = /^gpio:(\d+)$/.exec(item)?.[1];
        if (gpio === undefined) {
          issues.push(compIssue("E_ACC_HOST_POS", `${path}/host_pins/${hostRef}`, `${hostRef} is not a GPIO host position`));
          continue;
        }
        if (!board.pins[gpio]) board.pins[gpio] = { roles: [] };
        for (const role of row.roles ?? []) if (included(role, use)) board.pins[gpio].roles.push(sourceRole(accessory.id, role, mapping));
      }
    }

    for (const group of ["buses", "devices", "connectors"]) for (const [id, object] of Object.entries(accessory[group] ?? {})) {
      if (use && !use.has(id)) continue;
      const mapped = mapping[id] ?? id;
      if (board[group]?.[mapped]) {
        issues.push(compIssue("E_COMP_CONN_DUP", `${path}/${group}/${id}`, `${mapped} already exists`));
        continue;
      }
      if (!board[group]) board[group] = {};
      const added = clone(object);
      added.source = sourceInfo(accessory);
      if (group === "devices") {
        if (added.bus) added.bus = mapping[added.bus] ?? added.bus;
        for (const pin of Object.values(added.pins ?? {})) pin.roles = (pin.roles ?? []).map((role) => sourceRole(accessory.id, role, mapping));
      }
      board[group][mapped] = added;
    }
  }
  return { board, issues };
}

function validateComposition(board, entries, catalogs) {
  return compose(board, entries, catalogs).issues;
}

function validateAccessory(accessory, catalogs) {
  const issues = [];
  if (!accessory.origin || !["official", "third_party", "virtual"].includes(accessory.origin)) issues.push(compIssue("E_ACC_FORMAT", "/origin", "origin is required"));
  if (accessory.origin === "third_party" && (!accessory.vendor || !accessory.source_url)) issues.push(compIssue("E_ACC_FORMAT", "/origin", "third-party accessories require vendor and source_url"));
  const type = catalogs.connectorTypes?.[accessory.attaches?.connector_type];
  if (!type) issues.push(compIssue("E_COMP_INCOMPATIBLE", "/attaches/connector_type", "attachment connector type is missing"));
  const positions = new Set((type?.positions ?? []).map((position) => position.id));
  for (const ref of Object.keys(accessory.host_pins ?? {})) {
    const [connector, position] = ref.split(".");
    if (connector !== accessory.attaches?.connector_type || !positions.has(position)) issues.push(compIssue("E_ACC_HOST_POS", `/host_pins/${ref}`, `${ref} is not an attachment position`));
  }
  for (const [id, setting] of Object.entries(accessory.settings ?? {})) {
    if (setting.default !== null && !setting.choices?.[setting.default]) issues.push(compIssue("E_CHOICE_DEFAULT", `/settings/${id}/default`, "default is not a choice"));
    for (const [choice, fragment] of Object.entries(setting.choices ?? {})) for (const position of Object.keys(fragment.host_pins ?? {})) {
      const [connector, connectorPosition] = position.split(".");
      if (connector !== accessory.attaches?.connector_type || !positions.has(connectorPosition)) issues.push(compIssue("E_ACC_HOST_POS", `/settings/${id}/choices/${choice}/host_pins/${position}`, `${position} is not an attachment position`));
      if (accessory.host_pins?.[position]) issues.push(compIssue("E_CHOICE_KEY_OVERLAP", `/settings/${id}/choices/${choice}/host_pins/${position}`, `${position} is also static`));
    }
  }
  return issues;
}

function renderCompositionDoc(board, composition, accessories) {
  if (!composition?.accessories?.length) return null;
  const lines = [
    `# ${board.name} default composition`, "",
    "| Accessory | Origin | Bundled | Settings | Use |", "|---|---|---|---|---|",
  ];
  for (const entry of composition.accessories) {
    const accessory = accessories[entry.id];
    const settings = Object.entries(accessory?.settings ?? {}).map(([id, setting]) => `${id}=${entry.settings?.[id] ?? setting.default ?? "required"}`).join(", ") || "none";
    lines.push(`| ${entry.id} | ${accessory?.origin ?? "missing"} | ${accessory?.bundled === true ? "yes" : "no"} | ${settings} | ${(entry.use ?? ["all"]).join(", ")} |`);
  }
  return `${lines.join("\n")}\n`;
}


// lib/derive/sd.js
function endpointForRole(board, role) {
  for (const [gpio, pin] of Object.entries(board.pins ?? {})) if ((pin.roles ?? []).includes(role)) return `gpio:${gpio}`;
  return null;
}

function fixedSlotMatches(signals, slot, terminals) {
  return terminals.every((terminal) => signals[terminal] === `gpio:${slot.pins?.[terminal]}`);
}

function deriveSd(board, chip, sdPart) {
  const alias = sdPart?.spi_alias ?? {};
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    if (device.kind !== "sd") continue;
    const signals = device.signals ?? {};
    const modes = [];
    const bus = board.buses?.[device.bus];
    if (bus?.kind === "spi" && ["clk", "cmd", "d0"].every((terminal) => (
      alias[terminal] && signals[terminal] === endpointForRole(board, `bus:${device.bus}.${alias[terminal]}`)
    )) && signals.d3) {
      modes.push("spi");
    }

    const oneBit = ["clk", "cmd", "d0"];
    const fourBit = [...oneBit, "d1", "d2", "d3"];
    const matrix = chip?.sdmmc?.gpio_matrix === true;
    const slots = chip?.sdmmc?.slots ?? [];
    const supports = (terminals) => terminals.every((terminal) => signals[terminal]) && (
      matrix || slots.some((slot) => fixedSlotMatches(signals, slot, terminals))
    );
    if (supports(oneBit)) modes.push("sdio1");
    if (supports(fourBit)) modes.push("sdio4");

    device.derived = { modes };
    if (modes.includes("spi")) {
      device.derived.bus = device.bus;
      device.derived.cs = signals.d3;
    }
  }
  return board;
}


// lib/resolve.js






function connectorRoleGPIOs(board, connectorId) {
  const result = new Map();
  for (const entry of ownerRoleEntries(board)) {
    if (entry.owner !== "soc" || entry.parsed?.type !== "conn" || entry.parsed.id !== connectorId) continue;
    if (!result.has(entry.parsed.signal)) result.set(entry.parsed.signal, []);
    result.get(entry.parsed.signal).push(Number(entry.pin));
  }
  for (const gpios of result.values()) gpios.sort((a, b) => a - b);
  return result;
}

function connectorRoleEndpoints(board, connectorId) {
  const result = new Map();
  for (const entry of ownerRoleEntries(board)) {
    if (entry.parsed?.type !== "conn" || entry.parsed.id !== connectorId) continue;
    if (!result.has(entry.parsed.signal)) result.set(entry.parsed.signal, []);
    result.get(entry.parsed.signal).push(entry.endpoint);
  }
  return result;
}

function resolveConnectorPositions(board, connectorId, connectorTypes) {
  const connector = board.connectors?.[connectorId];
  const type = resolveConnectorType(connectorTypes, connector?.type);
  if (!connector || !type) return { positions: clone(connector?.positions ?? {}), sources: {}, type };
  const endpoints = connectorRoleEndpoints(board, connectorId);
  const positions = {};
  const sources = {};
  for (const position of type.positions) {
    const id = position.id;
    sources[id] = {
      fixed: Object.hasOwn(type.fixed_positions ?? {}, id),
      default: Object.hasOwn(type.default_positions ?? {}, id),
      explicit: Object.hasOwn(connector.positions ?? {}, id),
      endpoints: endpoints.get(id) ?? [],
      gpios: (endpoints.get(id) ?? []).flatMap((endpoint) => /^gpio:(\d+)$/.exec(endpoint)?.[1] ?? []).map(Number),
    };
    if (sources[id].fixed) positions[id] = clone(type.fixed_positions[id]);
    else if (sources[id].default) positions[id] = clone(type.default_positions[id]);
    if (sources[id].explicit) positions[id] = clone(connector.positions[id]);
    if (sources[id].endpoints.length === 1) positions[id] = sources[id].endpoints[0];
    else if (sources[id].endpoints.length > 1) positions[id] = sources[id].endpoints;
  }
  return { positions, sources, type };
}

function finishResolved(board, connectorTypes, catalogs) {
  deriveDeviceEndpoints(board);
  deriveSd(board, catalogs.chip, catalogs.parts?.sd_slot);
  for (const [id, connector] of Object.entries(board.connectors ?? {})) {
    const { positions, type } = resolveConnectorPositions(board, id, connectorTypes);
    if (type) connector.positions = positions;
  }
  return board;
}

function resolveBoard(board, selection = {}, connectorTypes = {}, catalogs = {}) {
  let resolved = finishResolved(materializeChoices(board, selection), connectorTypes, catalogs);
  if (catalogs.composition) {
    const result = compose(resolved, catalogs.composition.accessories ?? [], { ...catalogs, connectorTypes });
    resolved = finishResolved(result.board, connectorTypes, catalogs);
    Object.defineProperty(resolved, "__compositionIssues", { value: result.issues, enumerable: false });
  }
  return resolved;
}

function resolvedFilename(board, revision, runtime = {}) {
  const requireId = (value, label) => {
    if (typeof value !== "string" || !/^[a-z][a-z0-9_]*$/.test(value)) throw new Error(`${label} is not a safe ID`);
  };
  requireId(board.id, "board ID");
  if (revision) requireId(revision.id, "revision ID");
  for (const [slot, choice] of Object.entries(runtime)) {
    requireId(slot, "runtime slot");
    requireId(choice, "runtime choice");
  }
  const revisionPart = revision ? `@${revision.id}` : "";
  const runtimePart = Object.entries(runtime).map(([slot, choice]) => `+${slot}=${choice}`).join("");
  return `${board.id}${revisionPart}${runtimePart}.json`;
}

function resolveAll(board, connectorTypes = {}, catalogs = {}) {
  const revisions = board.revisions?.length ? board.revisions : [null];
  const runtimes = runtimeCombinations(board);
  return revisions.flatMap((revision) => runtimes.map((runtime) => {
    const selection = { ...revisionSelection(board, revision), ...runtime };
    return {
      filename: resolvedFilename(board, revision, runtime),
      revision: revision?.id ?? null,
      runtime,
      selection,
      board: resolveBoard(board, selection, connectorTypes, catalogs),
    };
  }));
}


// lib/format.js


const TOP_LEVEL_ORDER = ["schema_version", "id", "name", "legacy_board_id", "chip", "spec", "pins", "buses", "devices", "connectors", "revisions"];
const PRIORITY_KEYS = ["id", "kind", "type", "name"];

function orderedObject(value, priority = PRIORITY_KEYS) {
  const output = {};
  for (const key of priority) if (Object.prototype.hasOwnProperty.call(value, key)) output[key] = value[key];
  for (const [key, item] of Object.entries(value)) if (!priority.includes(key)) output[key] = item;
  return output;
}

function markGeneratedObject(board, value, path) {
  if (!isPlainObject(value)) return;
  const verified = isPlainObject(value.verified) ? clone(value.verified) : {};
  for (const field of Object.keys(value)) {
    if (!["verified", "measured_by"].includes(field) && isGeneratedField(board, path, field)) verified[field] = "generated";
  }
  if (Object.keys(verified).length) value.verified = verified;
}

function normalize(value, path = "") {
  if (Array.isArray(value)) return value.map((item, index) => normalize(item, `${path}/${index}`));
  if (!isPlainObject(value)) return value;

  let source = orderedObject(value);
  if (path === "") source = orderedObject(value, TOP_LEVEL_ORDER);
  if (path === "/pins") {
    source = Object.fromEntries(Object.entries(value).sort(([a], [b]) => Number(a) - Number(b)));
  }
  if (/^\/devices\/[^/]+\/pins$/.test(path)) source = orderedObject(value, []);

  const output = {};
  for (const [key, item] of Object.entries(source)) output[key] = normalize(item, `${path}/${key}`);
  return output;
}

function formatBoardObject(board) {
  const output = clone(board);
  for (const [gpio, pin] of Object.entries(output.pins ?? {})) markGeneratedObject(output, pin, `/pins/${gpio}`);
  for (const [id, bus] of Object.entries(output.buses ?? {})) markGeneratedObject(output, bus, `/buses/${id}`);
  for (const [id, device] of Object.entries(output.devices ?? {})) markGeneratedObject(output, device, `/devices/${id}`);
  return normalize(output);
}

function formatBoard(board) {
  return `${JSON.stringify(formatBoardObject(board), null, 2)}\n`;
}

function checkFormatIdempotent(board, formatter = formatBoard) {
  const once = formatter(board);
  let parsed;
  try {
    parsed = JSON.parse(once);
  } catch {
    return false;
  }
  return formatter(parsed) === once;
}


// lib/validate.js












const error = (id, path, message) => ({ id, path, message });
const warning = (id, path, message) => ({ id, path, message, severity: "warning" });
const own = (value, key) => Object.prototype.hasOwnProperty.call(value, key);

function validateDeviceSpecKeys(board, schema, errors) {
  const allowedByKind = schema.definitions.deviceKind["x-spec-properties"];
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    if (!isPlainObject(device.spec)) continue;
    const allowed = new Set(allowedByKind[device.kind] ?? []);
    for (const key of Object.keys(device.spec)) {
      if (!allowed.has(key)) errors.push(error("E_UNKNOWN_KEY", `/devices/${id}/spec/${key}`, `spec key is not declared for ${device.kind}`));
    }
  }
}

function validateIds(board, schema, errors) {
  const pattern = new RegExp(schema.definitions.id.pattern);
  const check = (value, path) => {
    if (typeof value !== "string" || !pattern.test(value)) errors.push(error("E_ID_FORMAT", path, "ID must be snake_case ASCII"));
  };
  check(board.id, "/id");
  check(board.chip, "/chip");
  for (const group of ["buses", "devices", "connectors"]) for (const id of Object.keys(board[group] ?? {})) check(id, `/${group}/${id}`);
  for (const [index, revision] of (board.revisions ?? []).entries()) check(revision.id, `/revisions/${index}/id`);
}

function validatePinKeys(board, chip, errors) {
  for (const pin of Object.keys(board.pins ?? {})) {
    const path = `/pins/${pin}`;
    if (!/^[0-9]+$/.test(pin)) errors.push(error("E_PIN_KEY", path, "SoC pin key must contain decimal digits only"));
    else if (Number(pin) >= chip.gpio_count) errors.push(error("E_PIN_KEY", path, `GPIO ${pin} is outside chip range 0..${chip.gpio_count - 1}`));
  }
}

function validateHex(value, schema, path, errors) {
  const pattern = new RegExp(schema.definitions.hexByte.pattern);
  if ((typeof value !== "string" || !pattern.test(value))) errors.push(error("E_HEX_FORMAT", path, "hex byte must use 0x notation"));
}

function validateHexFields(board, schema, errors) {
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    if (own(device, "i2c_addr")) validateHex(device.i2c_addr, schema, `/devices/${id}/i2c_addr`, errors);
    for (const [choice, fragment] of Object.entries(device.choices ?? {})) if (own(fragment, "i2c_addr")) validateHex(fragment.i2c_addr, schema, `/devices/${id}/choices/${choice}/i2c_addr`, errors);
  }
  for (const [index, sensor] of (board.spec?.sensors ?? []).entries()) if (own(sensor, "i2c_addr")) validateHex(sensor.i2c_addr, schema, `/spec/sensors/${index}/i2c_addr`, errors);
}

function roleEntries(board) {
  return ownerRoleEntries(board).map((entry) => ({ ...entry, gpio: entry.owner === "soc" ? entry.pin : null }));
}

function validateRoles(board, chip, schema, errors, resolved) {
  const entries = roleEntries(board);
  const seen = new Map();
  const busSignals = schema.definitions.busKind["x-signals"];
  const deviceSignals = schema.definitions.deviceKind["x-signals"];
  const busOutputs = new Set(schema.definitions.busKind["x-output-signals"]);
  const deviceOutputs = new Set(schema.definitions.deviceKind["x-output-signals"]);

  for (const entry of entries) {
    if (!resolved && entry.owner === "soc" && entry.role.includes("/")) {
      errors.push(error("E_ROLE_SOURCE", entry.path, "source prefixes are reserved for composed accessory roles"));
    }
    if (!entry.parsed) {
      errors.push(error("E_REF_MISSING", entry.path, `invalid role ${entry.role}`));
      continue;
    }
    if (entry.parsed?.type !== "conn" && entry.parsed?.type !== "pwr") {
      const location = `${entry.owner}.${entry.pin}`;
      const normalizedRole = `${entry.parsed.type}:${entry.parsed.id}.${entry.parsed.signal}`;
      if (seen.has(normalizedRole) && seen.get(normalizedRole) !== location) errors.push(error("E_ROLE_DUP", entry.path, `${entry.role} is also on ${seen.get(normalizedRole)}`));
      else seen.set(normalizedRole, location);
    }

    const { type, id, signal } = entry.parsed;
    let output = false;
    if (type === "bus") {
      const bus = board.buses?.[id];
      if (!bus || !(busSignals[bus.kind] ?? []).includes(signal) || !(bus.signals ?? []).includes(signal)) {
        errors.push(error("E_REF_MISSING", entry.path, `${entry.role} does not resolve through the bus schema`));
      }
      output = busOutputs.has(signal);
    } else if (type === "dev") {
      const device = board.devices?.[id];
      if (!device || !(deviceSignals[device.kind] ?? []).includes(signal)) {
        errors.push(error("E_REF_MISSING", entry.path, `${entry.role} does not resolve through the device schema`));
      }
      output = deviceOutputs.has(signal);
    } else if (type === "conn" && !board.connectors?.[id]) {
      errors.push(error("E_REF_MISSING", entry.path, `${entry.role} refers to a missing connector`));
    }

    if (entry.owner === "soc") {
      const gpio = Number(entry.gpio);
      if (output && chip.input_only.includes(gpio)) errors.push(error("E_CHIP_INPUT_ONLY", entry.path, `output role ${entry.role} is on input-only GPIO ${gpio}`));
      if (chip.reserved.includes(gpio)) errors.push(error("E_CHIP_RESERVED", entry.path, `GPIO ${gpio} is reserved by the chip/package`));
      const conditional = chip.reserved_conditional?.[board.spec?.storage?.psram_mode] ?? [];
      if (conditional.includes(gpio)) errors.push(error("E_CHIP_RESERVED_COND", entry.path, `GPIO ${gpio} is reserved when PSRAM mode is ${board.spec.storage.psram_mode}`));
      if (gpio === chip.usb?.dn || gpio === chip.usb?.dp) errors.push(warning("W_CHIP_USB_PIN", entry.path, `GPIO ${gpio} is shared with native USB`));
    }
  }

  for (const [gpio, pin] of Object.entries(board.pins ?? {})) {
    const parsed = (pin.roles ?? []).map(parseRole).filter(Boolean);
    const busRoles = parsed.filter((item) => item.type === "bus");
    if (busRoles.length > 1 && new Set(busRoles.map((item) => item.signal)).size > 1) {
      errors.push(error("E_BUS_CONFLICT", `/pins/${gpio}/roles`, "different bus signals share one GPIO"));
    }
    const chipSelects = parsed.filter((item) => item.type === "dev" && (
      item.signal === "cs" || (board.devices?.[item.id]?.kind === "sd" && item.signal === "d3")
    ));
    if (chipSelects.length > 1) errors.push(error("E_CS_CONFLICT", `/pins/${gpio}/roles`, "multiple device chip-select roles share one GPIO"));
  }
}

function validateReferences(board, schema, errors) {
  const entries = roleEntries(board);
  for (const [busId, bus] of Object.entries(board.buses ?? {})) {
    const allowed = new Set(schema.definitions.busKind["x-signals"][bus.kind] ?? []);
    for (const signal of bus.signals ?? []) {
      if (!allowed.has(signal)) errors.push(error("E_REF_MISSING", `/buses/${busId}/signals`, `${signal} is not declared for bus kind ${bus.kind}`));
      if (!entries.some((entry) => entry.parsed?.type === "bus" && entry.parsed.id === busId && entry.parsed.signal === signal)) {
        errors.push(error("E_SIGNAL_UNBOUND", `/buses/${busId}/signals`, `${signal} has no GPIO role`));
      }
    }
    if (bus.fixed === true && !own(bus, "preferred_host")) errors.push(error("E_REF_MISSING", `/buses/${busId}/preferred_host`, "fixed bus requires preferred_host"));
  }

  const allowedDeviceSignals = schema.definitions.deviceKind["x-signals"];
  for (const [deviceId, device] of Object.entries(board.devices ?? {})) {
    if (device.bus && !board.buses?.[device.bus]) errors.push(error("E_REF_MISSING", `/devices/${deviceId}/bus`, `missing bus ${device.bus}`));
    const allowed = new Set(allowedDeviceSignals[device.kind] ?? []);
    for (const signal of Object.keys(device.signals ?? {})) if (!allowed.has(signal)) {
      errors.push(error("E_REF_MISSING", `/devices/${deviceId}/signals/${signal}`, `${signal} is not declared for device kind ${device.kind}`));
    }
  }
}

const DEFAULT_RAILS = new Set(["gnd", "3v3", "5v", "5vout", "5vin", "bat", "vin", "vbus"]);
const DEFAULT_CHIP_ENDPOINTS = new Set(["en", "usb_dp", "usb_dn"]);

function validateConnectorEndpoint(endpoint, path, type, chip, errors, resolved) {
  const endpoints = Array.isArray(endpoint) ? endpoint : [endpoint];
  for (const value of endpoints) {
    if (typeof value !== "string") {
      errors.push(error("E_CONN_POS_ENDPOINT", path, "connector endpoint must be a string"));
      continue;
    }
    if (/^gpio:\d{1,2}$/.test(value)) {
      if (!resolved) errors.push(error("E_CONN_POS_GPIO", path, "GPIO connector assignments belong in pin roles"));
      continue;
    }
    const rail = /^pwr:([a-z0-9_]+)$/.exec(value)?.[1];
    if (rail && !DEFAULT_RAILS.has(rail) && !(type.rails ?? []).includes(rail)) {
      errors.push(error("E_RAIL_UNKNOWN", path, `unknown power rail ${rail}`));
      continue;
    }
    const chipPin = /^chip:([a-z0-9_]+)$/.exec(value)?.[1];
    if (chipPin && !DEFAULT_CHIP_ENDPOINTS.has(chipPin) && !(chip.connector_pins ?? []).includes(chipPin)) {
      errors.push(error("E_CONN_POS_ENDPOINT", path, `unknown non-GPIO chip pin ${chipPin}`));
      continue;
    }
    if (value === "none" || !/^(pin:[a-z][a-z0-9_]*\.[a-z0-9_]+|fixed:[a-z0-9_]+\.[a-z0-9_]+|pwr:[a-z0-9_]+|chip:[a-z0-9_]+|nc)$/.test(value)) {
      errors.push(error("E_CONN_POS_ENDPOINT", path, "endpoint is not valid for a connector position"));
    }
  }
}

function validateConnectors(board, chip, connectorTypes, errors, resolved) {
  const entries = roleEntries(board).filter((entry) => entry.parsed?.type === "conn");
  for (const entry of entries) {
    const connector = board.connectors?.[entry.parsed.id];
    if (!connector) continue;
    const type = resolveConnectorType(connectorTypes, connector.type);
    if (type && !(type.positions ?? []).some((position) => position.id === entry.parsed.signal)) {
      errors.push(error("E_CONN_POS_UNKNOWN", entry.path, `${entry.role} uses a position absent from ${connector.type}`));
    }
  }

  for (const [id, connector] of Object.entries(board.connectors ?? {})) {
    const path = `/connectors/${id}`;
    const type = resolveConnectorType(connectorTypes, connector.type);
    if (!type) {
      errors.push(error("E_CONN_TYPE_MISSING", `${path}/type`, `connector type ${connector.type ?? "<missing>"} is not in the catalog`));
      continue;
    }
    if (connector.standard && !own(type.standards ?? {}, connector.standard)) {
      errors.push(error("E_CONN_TYPE_MISSING", `${path}/standard`, `standard ${connector.standard} is not declared by ${connector.type}`));
    }
    const known = new Set(type.positions.map((position) => position.id));
    for (const position of [...Object.keys(connector.positions ?? {}), ...(connector.multi_gpio ?? [])]) {
      if (!known.has(position)) errors.push(error("E_CONN_POS_UNKNOWN", `${path}/positions/${position}`, `position ${position} is not declared by ${connector.type}`));
    }

    if (resolved) {
      const gpioPositions = new Map();
      for (const position of known) {
        if (!own(connector.positions ?? {}, position)) errors.push(error("E_CONN_POS_MISSING", `${path}/positions/${position}`, "resolved connector position is missing"));
        else {
          const endpoint = connector.positions[position];
          if (Array.isArray(endpoint) && !(connector.multi_gpio ?? []).includes(position)) {
            errors.push(error("E_CONN_POS_DUP", `${path}/positions/${position}`, "multiple resolved GPIOs require multi_gpio"));
          }
          validateConnectorEndpoint(endpoint, `${path}/positions/${position}`, type, chip, errors, true);
          for (const item of Array.isArray(endpoint) ? endpoint : [endpoint]) {
            const gpio = /^gpio:(\d+)$/.exec(item)?.[1];
            if (gpio !== undefined && gpioPositions.has(gpio) && gpioPositions.get(gpio) !== position) {
              errors.push(error("E_CONN_SAME_GPIO", `${path}/positions/${position}`, `GPIO ${gpio} is also assigned to position ${gpioPositions.get(gpio)}`));
            } else if (gpio !== undefined) gpioPositions.set(gpio, position);
          }
        }
      }
      continue;
    }

    const { sources } = resolveConnectorPositions(board, id, connectorTypes);
    for (const [position, source] of Object.entries(sources)) {
      const positionPath = `${path}/positions/${position}`;
      if (source.explicit) {
        validateConnectorEndpoint(connector.positions[position], positionPath, type, chip, errors, false);
        if (source.fixed) errors.push(error("E_CONN_POS_FIXED", positionPath, "fixed connector position cannot be overridden by a board"));
      }
      if ((source.explicit && source.gpios.length) || (source.fixed && source.gpios.length) || (source.gpios.length > 1 && !(connector.multi_gpio ?? []).includes(position))) {
        errors.push(error("E_CONN_POS_DUP", positionPath, "connector position has multiple assignment sources"));
      }
      if (!source.fixed && !source.default && !source.explicit && source.gpios.length === 0) {
        errors.push(error("E_CONN_POS_MISSING", positionPath, "connector position is not assigned"));
      }
      if ((connector.multi_gpio ?? []).includes(position) && source.gpios.length <= 1) {
        errors.push(warning("W_CONN_MULTI_UNUSED", `${path}/multi_gpio`, `position ${position} declares multi_gpio but has ${source.gpios.length} GPIO role(s)`));
      }
    }
  }
}

function walkVerified(board, value, path, errors) {
  if (Array.isArray(value)) {
    value.forEach((item, index) => walkVerified(board, item, `${path}/${index}`, errors));
    return;

  if (!isPlainObject(value)) return;
  if (isPlainObject(value.verified)) {
    for (const [field, status] of Object.entries(value.verified)) {
      if (!own(value, field)) errors.push(error("E_VERIFIED_KEY", `${path}/verified/${field}`, "verified key has no sibling field"));
      if (status === "generated" && !isGeneratedField(board, path, field)) errors.push(error("E_VERIFIED_FAKE", `${path}/verified/${field}`, "field is not consumed by a stage-0 target"));
      if (status === "measured" && (!isPlainObject(value.measured_by) || !value.measured_by[field])) {
        errors.push(error("E_MEASURED_BY", `${path}/verified/${field}`, "measured field needs measured_by"));
      }

  for (const [key, item] of Object.entries(value)) if (!["verified", "measured_by"].includes(key)) walkVerified(board, item, `${path}/${key}`, errors);

    if (own(device, field)) errors.push(error("E_UNKNOWN_KEY", `/devices/${id}/${field}`, `${field} is derived from pin roles`));

function validateSdAliases(board, parts, errors) {

    const parsed = (pin.roles ?? []).map((role) => ({ role, parsed: parseRole(role) })).filter((entry) => entry.parsed);
    const spiRoles = parsed.filter((entry) => entry.parsed.type === "bus" && board.buses?.[entry.parsed.id]?.kind === "spi");
    const sdRoles = parsed.filter((entry) => entry.parsed.type === "dev" && board.devices?.[entry.parsed.id]?.kind === "sd");
    for (const sdRole of sdRoles) for (const spiRole of spiRoles) {
      const device = board.devices[sdRole.parsed.id];
      const alias = parts?.[device.part]?.spi_alias?.[sdRole.parsed.signal];
      if (device.bus !== spiRole.parsed.id || alias !== spiRole.parsed.signal) {

      }

function validateSdModes(board, errors) {
  for (const [id, device] of Object.entries(board.devices ?? {})) if (device.kind === "sd" && !(device.derived?.modes?.length)) {
    errors.push(warning("W_SD_NO_MODE", `/devices/${id}/derived/modes`, "SD wiring supports no known mode"));

function validateEndpointOwners(board, errors) {
  const check = (endpoint, path) => {
    const owner = /^pin:([a-z][a-z0-9_]*)\./.exec(endpoint)?.[1];
    if (owner && owner !== "soc" && !board.devices?.[owner]) errors.push(error("E_ENDPOINT_OWNER", path, `pin owner ${owner} is not a device`));
  };
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    for (const [signal, endpoint] of Object.entries(device.signals ?? {})) check(endpoint, `/devices/${id}/signals/${signal}`);
    if (device.enable) check(device.enable, `/devices/${id}/enable`);
  }
  for (const [id, connector] of Object.entries(board.connectors ?? {})) for (const [position, endpoint] of Object.entries(connector.positions ?? {})) {
    for (const item of Array.isArray(endpoint) ? endpoint : [endpoint]) check(item, `/connectors/${id}/positions/${position}`);
  }
}

function unique(errors) {
  const seen = new Set();
  return errors.filter((item) => {
    const key = `${item.id}\0${item.path}\0${item.message}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function validateBoard(board, { schema, chip, connectorTypes = {}, parts = {}, target = {}, resolved = false }) {
  const errors = [...(board.__compositionIssues ?? []), ...validateSchema(board, schema)];
  validateDeviceSpecKeys(board, schema, errors);
  validateIds(board, schema, errors);

  validateHexFields(board, schema, errors);

  validateReferences(board, schema, errors);
  validateSdAliases(board, parts, errors);
  errors.push(...validateParts(board, parts, { resolved }));
  validateConnectors(board, chip, connectorTypes, errors, resolved);
  errors.push(...validateOwners(board, parts));
  walkVerified(board, board, "", errors);
  if (resolved) {
    validateEndpointOwners(board, errors);
    validateSdModes(board, errors);
  } else {
    validateSourceDerivedFields(board, errors);
    errors.push(...validateChoices(board));
    errors.push(...validateTarget(board, target));

}

function validateFormat(board, formatter) {
  return checkFormatIdempotent(board, formatter) ? [] : [error("E_FORMAT", "", "formatter is not idempotent")];
}

function validateCatalog(boards, contextForBoard) {
  const errors = [];
  const legacyIds = new Map();
  for (const board of boards) {
    errors.push(...validateBoard(board, contextForBoard(board)));
    const ids = [[board.legacy_board_id, board.id]];
    for (const [legacy, id] of ids) {
      if (!Number.isInteger(legacy)) continue;
      if (legacyIds.has(legacy)) errors.push(error("E_ID_FORMAT", `/${id}/legacy_board_id`, `legacy_board_id ${legacy} duplicates ${legacyIds.get(legacy)}`));
      else legacyIds.set(legacy, id);
    }
  }
  return unique(errors);
}

function validateResolvedVariants(board, context) {
  const errors = [];
  const fullCatalogs = {
    chip: context.chip,
    parts: context.parts,
    accessories: context.accessories,
    composition: context.composition,
    allow_origins: context.allow_origins,
  };
  const fullOutputs = resolveAll(board, context.connectorTypes, fullCatalogs);
  for (const output of fullOutputs) {
    errors.push(...validateBoard(output.board, { ...context, resolved: true }));

    try {

    const expected = JSON.stringify(baseWiring);

      const actual = emitWiring(output.board);
      if (actual && JSON.stringify(actual) !== expected) {
        errors.push(error("E_CHOICE_PINTABLE", `/revisions/${output.revision ?? "base"}`, "choice changes GPIO wiring consumed by a board-level generator"));
      }

  }
  const emitPins = (resolved) => {
    try {
      return JSON.stringify(emitPinTable(resolved, context.pinTableTarget).values);
    } catch (failure) {
      errors.push(error("E_CHOICE_PINTABLE", "/pins", failure.message));
      return null;
    }
  };
  const expectedPinTable = emitPins(resolveBoard(board, {}, context.connectorTypes, fullCatalogs));
  for (const output of fullOutputs) {
    const actualPinTable = emitPins(output.board);
    if (expectedPinTable && actualPinTable && actualPinTable !== expectedPinTable) {
      errors.push(error("E_CHOICE_PINTABLE", `/revisions/${output.revision ?? "base"}`, "choice changes GPIO wiring consumed by a board-level generator"));
    }
  }
  return unique(errors);
}

// DOM-free board editing operations shared by the browser editor and Node tests.

const BOARD_ID_PATTERN = /^[a-z][a-z0-9_]*$/;

class BoardOperationError extends Error {
  constructor(code, message) {
    super(message);
    this.name = "BoardOperationError";
    this.code = code;
  }
}

function boardOpClone(value) {
  return JSON.parse(JSON.stringify(value));
}

function requireId(id, label = "id") {
  if (!BOARD_ID_PATTERN.test(id)) throw new BoardOperationError("E_ID_FORMAT", `${label} must be snake_case ASCII`);
}

function clearGeneratedStatus(object, field) {
  if (object?.verified) {
    delete object.verified[field];
    if (!Object.keys(object.verified).length) delete object.verified;
  }
  if (object?.measured_by) {
    delete object.measured_by[field];
    if (!Object.keys(object.measured_by).length) delete object.measured_by;
  }
}

function compactObject(root, keys) {
  for (let index = keys.length - 1; index >= 0; index -= 1) {
    const parent = keys.slice(0, index).reduce((value, key) => value?.[key], root);
    const key = keys[index];
    if (parent?.[key] && typeof parent[key] === "object" && !Array.isArray(parent[key]) && !Object.keys(parent[key]).length) delete parent[key];

function roleRecords(board) {
  const records = [];
  for (const [gpio, pin] of Object.entries(board.pins ?? {})) for (const role of pin.roles ?? []) records.push({ owner: "soc", pin: gpio, role });
  for (const [deviceId, device] of Object.entries(board.devices ?? {})) {
    for (const [pinId, pin] of Object.entries(device.pins ?? {})) for (const role of pin.roles ?? []) records.push({ owner: deviceId, pin: pinId, role });
    for (const [choiceId, choice] of Object.entries(device.choices ?? {})) for (const [pinId, pin] of Object.entries(choice.pins ?? {})) {
      for (const role of pin.roles ?? []) records.push({ owner: `${deviceId}:${choiceId}`, pin: pinId, role });
    }
  }
  return records;
}

function boardRoleOptions(board, { schema, chip, parts = {}, connectorTypes = {}, resolveConnectorType: resolveType, currentGPIO = null }) {
  const roles = [];
  const busSignals = schema.definitions.busKind["x-signals"] ?? {};
  for (const [id, bus] of Object.entries(board.buses ?? {})) for (const signal of bus.signals ?? []) {
    if ((busSignals[bus.kind] ?? []).includes(signal)) roles.push(`bus:${id}.${signal}`);
  }
  for (const [id, device] of Object.entries(board.devices ?? {})) {
    const selectedParts = [device.part, ...Object.values(device.choices ?? {}).map((choice) => choice.part)].filter(Boolean).map((partId) => parts[partId]).filter(Boolean);
    const signals = selectedParts.length
      ? selectedParts.flatMap((part) => [...(part.signals?.required ?? []), ...(part.signals?.optional ?? [])])

class SearchCombobox {
  constructor(root, options, onSelect, readonlyReason = "") {
    this.root = root;
    this.input = root.querySelector("input");
    this.list = root.querySelector("[role=listbox]");
