<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M5 Board Spec Editor</title>
  <!-- @inline style -->
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow" data-i18n="app.catalog">M5 board specification catalog</p>
      <h1 data-i18n="app.heading">GPIO specification editor</h1>
    </div>
    <div class="header-controls">
      <div id="save-state" class="save-state" aria-live="polite"></div>
      <label class="language-picker">
        <span aria-hidden="true">🌐</span>
        <select id="language-select" aria-label="Language" data-i18n-aria-label="toolbar.language">
          <option value="en" data-i18n="language.en">English</option>
          <option value="zh" data-i18n="language.zh">Chinese (Simplified)</option>
          <option value="ja" data-i18n="language.ja">Japanese</option>
        </select>
      </label>
    </div>
  </header>

  <section class="toolbar" aria-label="Files and board" data-i18n-aria-label="toolbar.label">
    <label><span data-i18n="toolbar.board">Board</span>
      <select id="board-select"></select>
    </label>
    <button id="new-board-button" type="button" data-i18n="toolbar.new">New</button>
    <button id="duplicate-board-button" type="button" class="secondary" data-i18n="toolbar.duplicate">Duplicate</button>
    <button id="close-board-button" type="button" class="secondary" data-i18n="toolbar.close">Close</button>
    <label class="file-button"><span data-i18n="toolbar.open">Open JSON</span>
      <input id="file-input" type="file" accept="application/json,.json">
    </label>
    <button id="download-button" type="button" data-i18n="toolbar.download">Download formatted JSON</button>
    <button id="discard-button" type="button" class="secondary" data-i18n="toolbar.discard">Discard draft</button>
    <div id="drop-zone" class="drop-zone" tabindex="0" data-i18n="toolbar.drop">Drop JSON here</div>
  </section>

  <section id="option-panel" class="option-panel" aria-label="Resolved revisions" data-i18n-aria-label="options.label"></section>
  <div class="mode-bar">
    <p id="mode-note" class="mode-note"></p>
    <button id="edit-base-button" type="button" class="secondary" data-i18n="mode.editBase">Edit raw data</button>
  </div>

  <nav id="view-tabs" class="view-tabs" aria-label="Editor views" data-i18n-aria-label="views.label">
    <button type="button" data-view="configuration" class="active" data-i18n="views.configuration">Configuration</button>
    <button type="button" data-view="revisions" data-i18n="views.revisions">Revisions</button>
    <button type="button" data-view="owners" data-i18n="views.owners">Pin owners</button>
  </nav>

  <main id="configuration-view" class="workspace view-panel">
    <section class="card gpio-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="gpio.eyebrow">Main</p>
          <h2 data-i18n="gpio.heading">GPIO</h2>
        </div>
        <div class="legend" aria-label="GPIO attribute legend" data-i18n-aria-label="gpio.legend">
          <span class="legend-reserved" data-i18n="gpio.reserved">reserved</span>
          <span class="legend-input" data-i18n="gpio.inputOnly">input only</span>
          <span class="legend-strapping" data-i18n="gpio.strapping">strapping</span>
        </div>
      </div>
      <div class="table-wrap">
        <table id="gpio-table">
          <thead><tr id="gpio-columns"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <aside class="side-column">
      <section class="card configuration-card">
        <div class="section-heading"><div><p class="eyebrow" data-i18n="configuration.eyebrow">declared objects</p><h2 data-i18n="configuration.heading">Configuration</h2></div></div>
        <div id="configuration-list"></div>
      </section>
      <section class="card validation-card">
        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="validation.eyebrow">live</p><h2 data-i18n="validation.heading">Validation</h2></div>
          <strong id="validation-count"></strong>
        </div>
        <div id="validation-list" aria-live="polite"></div>
      </section>

      <section class="card connector-card">
        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="connector.eyebrow">catalog driven</p><h2 data-i18n="connector.heading">Connectors</h2></div>
          <div class="connector-actions">
            <div id="connector-view-toggle" class="connector-view-toggle" aria-label="View" data-i18n-aria-label="connector.view">
              <button type="button" data-connector-view="table" aria-pressed="true" data-i18n="connector.table">Table</button>
              <button type="button" data-connector-view="svg" aria-pressed="false" data-i18n="connector.diagram">Diagram</button>
            </div>
            <button id="connector-undo" type="button" class="secondary" data-i18n="connector.undo">Undo</button>
          </div>
        </div>
        <div id="connector-tabs" class="connector-tabs" role="tablist"></div>
        <div id="connector-diagram" class="connector-diagram"></div>
        <div id="connector-editor" class="connector-editor"></div>
      </section>

      <section class="card related-card">
        <div class="section-heading"><div><p class="eyebrow" data-i18n="related.eyebrow">read only</p><h2 data-i18n="related.heading">Related objects</h2></div></div>
        <div id="related-list"></div>
      </section>
    </aside>
  </main>

  <main id="revisions-view" class="single-view view-panel" hidden>
    <section class="card"><div class="section-heading"><div><p class="eyebrow" data-i18n="revisions.eyebrow">choices</p><h2 data-i18n="revisions.heading">Revisions</h2></div></div><div id="revision-editor"></div></section>
  </main>

  <main id="owners-view" class="single-view view-panel" hidden>
    <section class="card owner-card"><div class="section-heading"><div><p class="eyebrow" data-i18n="owners.eyebrow">device pins</p><h2 data-i18n="owners.heading">Pin owners</h2></div></div><div id="owner-editor"></div></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="board-dialog" class="board-dialog">
    <form id="board-dialog-form" method="dialog">
      <h2 id="board-dialog-title"></h2>
      <label><span data-i18n="field.id">ID</span><input name="id" required pattern="[a-z][a-z0-9_]*"></label>
      <label><span data-i18n="field.name">Name</span><input name="name" required></label>
      <label><span data-i18n="field.legacyId">Legacy board ID</span><input name="legacy_board_id" type="number" required step="1"></label>
      <label><span data-i18n="field.chip">Chip</span><select name="chip"></select></label>
      <p id="board-dialog-error" class="dialog-error" aria-live="polite"></p>
      <div class="dialog-actions"><button type="button" class="secondary" data-dialog-cancel data-i18n="dialog.cancel">Cancel</button><button type="submit" data-i18n="dialog.create">Create</button></div>
    </form>
  </dialog>
