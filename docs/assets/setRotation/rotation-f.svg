<rect x="5" y="163" width="8" height="8" fill="#38bdf8"/>
<rect x="251" y="163" width="8" height="8" fill="#f472b6"/>
<g transform="translate(132.0 88.0)"><g transform="scale(18)"><use href="#glyph-f" transform="translate(-1.5 -2.5)" fill="#ffffff"/></g></g>
<path d="M0 49 V0 H49" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="0" cy="0" r="4" fill="#ffffff"/></g>
<text class="axis-label" x="24" y="24">0,0</text>
<text class="axis-label" x="65" y="13">X</text>
<text class="axis-label" x="13" y="65">Y</text>
</g>
<text class="detail" x="22" y="291">width × height = W × H</text></g>
