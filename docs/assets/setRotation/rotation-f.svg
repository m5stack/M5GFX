<text x="42" y="539" font-size="15" font-weight="700" letter-spacing="1.2">4–7 / REFLECT LOGICAL Y, THEN ROTATE</text>
<line x1="42" y1="896" x2="1438" y2="896" stroke="#dce3eb"/>
<text x="42" y="925" font-size="17" font-weight="700">Mirror Y = top/bottom reflection before rotation. Value 6 is a left/right reflection.</text>
<text x="42" y="952" font-size="16" fill="#4b5e76">W and H are the dimensions at rotation 0. The F is redrawn after each call; the physical screen does not turn.</text>
<text x="42" y="980" font-size="15" fill="#4b5e76">Generic LCD mapping, non-mirrored mounting. Device startup orientation can differ. See docs/api/display.md.</text>
</svg>
